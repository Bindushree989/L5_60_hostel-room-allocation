name: Hostel Static Code Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install program packages and analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask pyyaml pylint bandit flake8

      - name: Run original program
        env:
          WARDEN_DB_PASSWORD: ${{ secrets.WARDEN_DB_PASSWORD }}
        run: |
          python hostel_allocation.py

      - name: Run Pylint
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pylint hostel_allocation.py \
            > reports/pylint_report_after.txt 2>&1

      - name: Run Bandit
        continue-on-error: true
        run: |
          python -m bandit -r hostel_allocation.py \
            > reports/bandit_report_after.txt 2>&1

      - name: Run Flake8
        continue-on-error: true
        run: |
          python -m flake8 hostel_allocation.py \
            > reports/flake8_report_after.txt 2>&1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostel-static-analysis-reports
          path: reports/
